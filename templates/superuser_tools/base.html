<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Bookings tools{% endblock %}</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0; --blue:#0369a1; --green:#047857; --red:#b91c1c; --amber:#92400e; --amberbg:#fef3c7; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:880px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:20px; margin:0 0 4px; }
  h2 { font-size:16px; margin:0 0 4px; }
  p { margin:6px 0; }
  .muted { color:var(--muted); font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-top:16px; }
  .danger { border-color:#fecaca; }
  .danger h2 { color:var(--red); }
  label { display:block; font-weight:600; font-size:13px; margin:12px 0 4px; }
  input[type=text], input[type=password], input[type=file] { width:100%; padding:10px 12px; border:1px solid #cbd5e1; border-radius:10px; font:inherit; background:#fff; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .row > div { flex:1 1 220px; }
  button { font:inherit; font-weight:700; border:0; border-radius:10px; padding:10px 16px; cursor:pointer; color:#fff; background:var(--blue); }
  button.green { background:var(--green); }
  button.red { background:var(--red); }
  button.plain { background:#fff; color:var(--text); border:1px solid #cbd5e1; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .msg { padding:12px 14px; border-radius:10px; margin-top:16px; font-weight:600; }
  .ok { background:#d1fae5; color:#065f46; }
  .err { background:#fee2e2; color:#991b1b; }
  .warn { background:var(--amberbg); color:var(--amber); }
  .stats { display:flex; gap:12px; flex-wrap:wrap; margin-top:12px; }
  .stat { flex:1 1 160px; background:#f8fafc; border:1px solid var(--line); border-radius:12px; padding:12px; }
  .stat b { font-size:22px; display:block; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; margin-top:8px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  code { background:#f1f5f9; padding:1px 5px; border-radius:6px; font-size:12px; word-break:break-word; }
  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
</style>
</head>
<body>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
